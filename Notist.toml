[package]
name = "icexiv-db"

[site]
title = "IceXIV DB"
base_url = "relative"
content = "content"
templates = "templates"
static_dir = "static"
# site.data is supplied by the items extension.
data = "site-data"

[site.extensions.items]
command = ["python3", "scripts/items.py", "extension"]
watch = ["scripts", "sources", "inputs/game-export/manifest.json", "inputs/game-export/items.json", "content/.data/prepared.json"]
