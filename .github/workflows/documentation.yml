name: Database website

on:
  push:
  pull_request:
  workflow_dispatch:
  # Follow datamining-cn: a daily rebuild picks up new CSV rows.
  schedule:
    - cron: '0 20 * * *'
  repository_dispatch:
    types: [datamining-update]

permissions:
  contents: read

jobs:
  offline-site:
    runs-on: ubuntu-latest
    concurrency:
      group: db-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build locked Notist CLI
        run: nix build --no-update-lock-file --max-jobs 1 --cores 2 .#notist --out-link result-notist
      - name: Test offline catalog and site fixture
        env:
          NOTIST_TEST_BIN: ${{ github.workspace }}/result-notist/bin/notist
        run: |
          nix build --no-update-lock-file .#site-python --out-link result-python
          echo "$PWD/result-python/bin" >> "$GITHUB_PATH"
          PATH="$PWD/result-python/bin:$PATH" python3 -m unittest discover -s tests -v
          node --test tests/catalog.test.cjs

      - name: Fetch datamining CSVs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DM_REPO: thewakingsands/ffxiv-datamining-cn
          DM_COMMIT: ${{ vars.DATAMINING_COMMIT }}
        run: |
          commit="${DM_COMMIT:-$(git ls-remote "https://github.com/$DM_REPO" HEAD | cut -f1)}"
          echo "DM_COMMIT=$commit" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dm"
          for name in Item ItemAction ClassJob ClassJobCategory EquipSlotCategory Recipe \
                      OrchestrionPath Emote ActionTimeline Action GameConditionValueArray \
                      BannerCondition BannerBg BannerFrame BannerDecoration BannerTimeline \
                      CharaCardBase CharaCardDecoration CharaCardHeader; do
            curl -fsSL --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/$DM_REPO/$commit/$name.csv" \
              -o "$RUNNER_TEMP/dm/$name.csv"
          done

      - name: Build the site data manifest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python3 scripts/pipeline/manifest.py from-csv "$RUNNER_TEMP/dm" --commit "$DM_COMMIT"

      - name: Prepare pure manifest data
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python3 scripts/items.py prepare

      - name: Install pinned renderer SDK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GAME_ASSETS_SOURCE != 'disabled'
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ vars.RENDERER_RELEASE_TAG || 'dev-build' }}
          SDK_SHA256: ${{ vars.RENDERER_SDK_SHA256 || '80e6151a1696efc0c4607409dcafa0cc43f53ebc12af738f3216beeefe6be4b4' }}
        run: |
          gh release download "$SDK_TAG" --repo icexiv/icexiv-renderer \
            --pattern icexiv-renderer-web.tgz --dir "$RUNNER_TEMP"
          python3 scripts/media.py install-sdk "$RUNNER_TEMP/icexiv-renderer-web.tgz" \
            --sha256 "$SDK_SHA256"

      - name: Package and verify both sites
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GAME_ASSETS_SOURCE: ${{ vars.GAME_ASSETS_SOURCE || vars.GAME_ASSET_CDN_ROOT || 'prod' }}
        run: |
          result-notist/bin/notist build -j 2
          python3 scripts/package_site.py notist-output/icexiv-db dist/pages dist/domestic
          python3 scripts/check_site.py dist/pages
          python3 scripts/check_site.py dist/domestic
          tar -czf domestic.tar.gz -C dist/domestic .

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/pages

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: domestic-site
          path: domestic.tar.gz
          retention-days: 7

  pages:
    needs: offline-site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: db-deploy-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4

  server:
    needs: offline-site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: db-deploy-server
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'deploy@82.156.196.54' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: domestic-site
      - name: Deploy to db.icexiv.top
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$DEPLOY_HOST" < domestic.tar.gz
