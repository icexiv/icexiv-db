[package]
name = "icexiv-db-game-export"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Pinned by Cargo.lock; no adjacent checkout required.
icexiv-data = { git = "https://github.com/icexiv/icexiv-data.git", rev = "c365a807a6bcf48b2696823d2145acce26500074", features = ["local"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
