[package]
name = "icexiv-db-game-export"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Local development dependency; includes the uncommitted texture implementation.
icexiv-data = { path = "../../../icexiv-data", features = ["local"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
